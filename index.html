<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas Party Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#faf6ef,#0d1712);--paper:light-dark(#ffffff,#15241b);--ink:light-dark(#1a231d,#eef2ec);
--muted:light-dark(#5d6a61,#9fb2a5);--line:light-dark(#e7e0d2,#26392d);--pine:#163d28;--pine2:#1f5236;
--berry:light-dark(#b0182d,#ff6f81);--gold:#e7ae45;--ok:light-dark(#1f7a46,#6fd39a);--soft:light-dark(#f3eee4,#1b2d22)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(20px,3.5vw,48px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:"Young Serif",Georgia,serif;font-weight:400;line-height:1.05;margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;min-height:44px;border-radius:10px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select{font-size:16px;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);width:100%}
label{font-size:13px;font-weight:600;color:var(--muted);display:grid;gap:4px}
.btn{background:var(--berry);color:#fff;font-weight:600;padding:0 18px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;min-height:44px;border-radius:10px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.hero{background:var(--pine);color:#f6f1e6;position:relative;padding-top:clamp(64px,8vw,96px)}
.lights{position:absolute;inset:0 0 auto 0;height:70px;width:100%}
.lights circle{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.lights circle{animation:none}}
.hero .wrap{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:end;justify-content:space-between}
.hero h1{font-size:clamp(32px,5vw,52px)}
.meta{margin:8px 0 0;color:#cfe0d3;display:flex;flex-wrap:wrap;gap:4px 16px}
.hero .btn.ghost{color:#f6f1e6;border-color:#ffffff44}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:#ffffff22;border-radius:14px;overflow:hidden;margin-top:24px}
.stats div{background:var(--pine2);padding:14px 16px}
.stats b{display:block;font:400 clamp(26px,4vw,36px)/1 "Young Serif",serif;color:#fff}
.stats span{font-size:13px;color:#cfe0d3}
.music{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:20px;display:grid;gap:10px}
.music header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.music h2{font-size:22px}
.music iframe{width:100%;height:152px;border:0;border-radius:12px;display:block}
.music p{margin:0;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
.tabs{display:flex;background:var(--soft);border-radius:12px;padding:4px}
.tabs button{padding:0 16px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px #0002}
.bar .right{display:flex;gap:8px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.bar input{max-width:260px}
.add{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr 1.6fr 1fr auto;gap:10px;align-items:end;margin-bottom:24px}
.add h2{grid-column:1/-1;font-size:20px}
.add.items{grid-template-columns:2fr 1fr auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.host{background:var(--paper);border-radius:16px;border:1.5px solid var(--line);border-top:6px solid var(--c);padding:16px 16px 8px;display:flex;flex-direction:column}
.host header{display:flex;align-items:center;gap:10px}
.host h3{font-size:24px;flex:1}
.host .sub{font-size:13px;color:var(--muted)}
.own{margin:10px 0 6px;padding:8px 12px;background:var(--soft);border-radius:10px;font-size:15px}
.own em{color:var(--muted);font-style:normal}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--paper);border:1px solid var(--line);margin:2px 4px 2px 0}
ul{list-style:none;margin:0;padding:0}
.g{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.g:first-child{border-top:0}
.g b{font-weight:600}
.g.no b{text-decoration:line-through;color:var(--muted)}
.st{font-size:13px;font-weight:700;padding:0 10px;width:84px;border:1.5px solid currentColor}
.st.invited{color:var(--muted)}.st.coming{color:var(--ok)}.st.maybe{color:#b7801c}.st.no{color:var(--berry)}
.icon{width:44px;color:var(--muted);font-size:20px}
.icon:hover{color:var(--ink);background:var(--soft)}
.empty{color:var(--muted);padding:12px 0;font-size:15px}
.big-empty{text-align:center;padding:48px 16px;border:2px dashed var(--line);border-radius:16px;color:var(--muted)}
.big-empty h2{color:var(--ink);font-size:28px;margin-bottom:8px}
.progress{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-weight:600}
.meter{flex:1;height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.list{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:4px 16px}
.it{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,220px) 44px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it b{font-weight:600;overflow-wrap:anywhere}
.it.open b::after{content:"needs someone";margin-left:8px;font:700 12px Figtree,sans-serif;color:var(--berry)}
.it select{border-left:5px solid var(--c,var(--line))}
.sugg{margin-top:14px;color:var(--muted);font-size:15px}
.sugg button{min-height:36px;padding:0 12px;border:1.5px dashed var(--line);margin:4px 6px 0 0;font-size:14px;color:var(--ink)}
.note{background:light-dark(#fff4dc,#3a2e12);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:15px}
dialog{border:0;border-radius:18px;padding:22px;width:min(460px,92vw);background:var(--paper);color:var(--ink);box-shadow:0 20px 60px #0006}
dialog::backdrop{background:#0a140e99}
dialog h2{font-size:26px;margin-bottom:14px}
dialog form{display:grid;gap:12px}
.row{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.row .del{color:var(--berry);font-weight:600;padding:0 8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
[hidden]{display:none!important}
@media(max-width:900px){.add{grid-template-columns:1fr 1fr}.add .btn{grid-column:1/-1}}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.add,.add.items{grid-template-columns:1fr}.bar input{max-width:none}.grid{grid-template-columns:1fr}
.it{grid-template-columns:minmax(0,1fr) 44px}.it select{grid-column:1/-1;grid-row:2}}
</style>
</head>
<body>
<header class="band hero">
  <svg class="lights" viewBox="0 0 1200 70" preserveAspectRatio="none" aria-hidden="true" id="lights"></svg>
  <div class="wrap">
    <div>
      <h1 id="pTitle">Our house Christmas party</h1>
      <p class="meta" id="pMeta"><span>Add a date, time and place</span></p>
    </div>
    <button class="btn ghost" id="editParty">Edit party details</button>
  </div>
  <div class="wrap stats" id="stats"></div>
</header>

<main class="band"><div class="wrap">
  <div class="note" id="note" hidden></div>

  <section class="music" id="music"></section>

  <div class="bar">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="hosts">Guests</button>
      <button role="tab" aria-selected="false" data-tab="items">What we need</button>
    </div>
    <div class="right">
      <input type="search" id="q" placeholder="Search" aria-label="Search">
      <button class="btn ghost" id="addHostBtn">+ Housemate</button>
    </div>
  </div>

  <section id="vHosts">
    <form class="add" id="addForm" hidden>
      <h2>Add a guest</h2>
      <label>Invited by<select id="aHost"></select></label>
      <label>Guest name<input id="aName" required autocomplete="off" placeholder="e.g. Lena"></label>
      <label>RSVP<select id="aSt"></select></label>
      <button class="btn" type="submit">Add guest</button>
    </form>
    <div id="hosts"></div>
  </section>

  <section id="vItems" hidden>
    <form class="add items" id="itemForm">
      <h2>Add something we need</h2>
      <label>Thing<input id="iName" required autocomplete="off" placeholder="e.g. ice, speaker, fairy lights"></label>
      <label>Who's bringing it<select id="iWho"></select></label>
      <button class="btn" type="submit">Add to list</button>
    </form>
    <div id="items"></div>
  </section>
</div></main>

<dialog id="dGuest"><h2>Edit guest</h2><form id="fGuest">
  <label>Guest name<input id="gName" required autocomplete="off"></label>
  <label>Invited by<select id="gHost"></select></label>
  <label>RSVP<select id="gSt"></select></label>
  <div class="row"><button type="button" class="del" id="gDel">Remove guest</button>
  <span><button type="button" class="btn ghost" data-close>Cancel</button> <button class="btn">Save</button></span></div>
</form></dialog>

<dialog id="dHost"><h2 id="dhT">Add a housemate</h2><form id="fHost">
  <label>Name<input id="hName" required autocomplete="off"></label>
  <div class="row"><button type="button" class="del" id="hDel">Remove housemate</button>
  <span><button type="button" class="btn ghost" data-close>Cancel</button> <button class="btn">Save</button></span></div>
</form></dialog>

<dialog id="dParty"><h2>Party details</h2><form id="fParty">
  <label>Party name<input id="pT" autocomplete="off" placeholder="Our house Christmas party"></label>
  <label>Date<input id="pD" type="date"></label>
  <label>Time<input id="pH" type="time"></label>
  <label>Where<input id="pW" autocomplete="off" placeholder="Our place"></label>
  <label>Spotify playlist link<input id="pS" type="url" autocomplete="off" placeholder="https://open.spotify.com/playlist/…"></label>
  <div class="row"><span></span><span><button type="button" class="btn ghost" data-close>Cancel</button> <button class="btn">Save</button></span></div>
</form></dialog>

<dialog id="dConfirm"><h2 id="cT">Are you sure?</h2><p id="cP"></p>
  <div class="row"><span></span><span><button type="button" class="btn ghost" data-close>Cancel</button> <button class="btn" id="cOk">Remove</button></span></div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
{
// ▼ Your Google Apps Script web app URL (see SETUP.md)
const SHEET_URL="https://script.google.com/macros/s/AKfycbyQfFYU5T4dTEnuxfHRJ8wmXKIkdEsTHKqZ5AARUV05Mmy-hY75uLKkCK3qbn_saEB6/exec";
const ST={invited:"Invited",coming:"Coming",maybe:"Maybe",no:"Can't"};
const ORDER=["invited","coming","maybe","no"];
const SUGG=["Ice","Cups","Mixers","Beer","Wine","Mulled wine","Snacks","Speaker","Fairy lights","Decorations","Bin bags","Bottle opener"];
const COLS=["#b0182d","#1f7a46","#e7ae45","#2f6db5","#8a4fbf","#d3642b","#2a9d9a","#c2457e"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S={hosts:[],guests:[],items:[],party:{},tab:"hosts",q:""};
let editing=null,confirmFn=null,pending=0,shownPlaylist=null;
const KEY="xmas-party-v2";
function save(){try{localStorage.setItem(KEY,JSON.stringify({hosts:S.hosts,guests:S.guests,items:S.items,party:S.party}))}catch(e){}}
try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(d){S.hosts=d.hosts||[];S.guests=d.guests||[];S.items=d.items||[];S.party=d.party||{}}}catch(e){}

// fairy lights
{const pts=[];let s="";for(let i=0;i<=24;i++)pts.push([i*50,14+Math.sin(i*Math.PI/2)**2*22]);
s+=`<path d="M${pts.map(p=>p.join(" ")).join(" L")}" fill="none" stroke="#0b2617" stroke-width="2"/>`;
const lc=["#ff5a6e","#ffd166","#7ee0a2","#8fc3ff","#ffb4e1"];
pts.forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]+7}" r="6" fill="${lc[i%5]}" style="animation-delay:${(i%5)*.45}s"/>`});
$("#lights").innerHTML=s;}

const opt=(arr,lab)=>arr.map(v=>`<option value="${esc(v)}">${esc(lab?lab[v]:v)}</option>`).join("");
for(const id of["#aSt","#gSt"])$(id).innerHTML=opt(ORDER,ST);
const hostOpts=(none)=>(none?`<option value="">${none}</option>`:"")+S.hosts.map(h=>`<option value="${esc(h.id)}">${esc(h.name)}</option>`).join("");

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2600)}
function note(m){const n=$("#note");n.hidden=!m;n.textContent=m||""}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

const by=a=>(a||[]).slice().sort((x,y)=>(+x.created||0)-(+y.created||0));
function applyRemote(d){S.hosts=by(d.hosts);S.guests=by(d.guests);S.items=by(d.items);S.party=d.party||{};save();render()}
async function sync(body){
  save();render();if(!SHEET_URL)return;pending++;
  try{const r=await fetch(SHEET_URL,{method:"POST",body:JSON.stringify(body)});const d=await r.json();
    if(d.error)throw new Error(d.error);pending--;if(!pending)applyRemote(d);note("")}
  catch(e){pending--;toast("Couldn't save to the Google Sheet — check your connection and try again.")}
}
function put(col,id,data){const arr=S[col];const i=arr.findIndex(x=>x.id===id);const row={id,...data};i<0?arr.push(row):arr[i]=row;return sync({action:"put",col,id,data})}
function del(col,id){S[col]=S[col].filter(x=>x.id!==id);return sync({action:"del",col,id})}
const strip=o=>{const c={...o};delete c.id;return c};

function hostColor(id){const i=S.hosts.findIndex(h=>h.id===id);return i<0?"":COLS[i%COLS.length]}
function match(...xs){const q=S.q.trim().toLowerCase();return !q||xs.some(x=>String(x||"").toLowerCase().includes(q))}
function playlistId(u){const m=String(u||"").match(/open\.spotify\.com\/(?:intl-[a-z-]+\/)?(playlist|album)\/([A-Za-z0-9]+)/);return m?m[1]+"/"+m[2]:null}

function renderParty(){
  const p=S.party;$("#pTitle").textContent=p.title||"Our house Christmas party";
  const bits=[];
  if(p.date){const d=new Date(p.date+"T12:00");if(!isNaN(d))bits.push(d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"}))}
  if(p.time)bits.push(p.time);if(p.where)bits.push(p.where);
  $("#pMeta").innerHTML=bits.length?bits.map(b=>`<span>${esc(b)}</span>`).join(""):"<span>Add a date, time and place</span>";
  const g=S.guests,c=g.filter(x=>x.status==="coming").length,m=g.filter(x=>x.status==="maybe").length;
  const done=S.items.filter(i=>i.who&&S.hosts.some(h=>h.id===i.who)).length;
  $("#stats").innerHTML=[[g.length,"guests invited"],[c+S.hosts.length,"heads coming (incl. housemates)"],[m,"maybes"],[`${done}/${S.items.length}`,"things sorted"]]
    .map(([n,l])=>`<div><b>${n}</b><span>${l}</span></div>`).join("");
}

function renderMusic(){
  const url=S.party.playlist||"";if(url===shownPlaylist)return;shownPlaylist=url;
  const id=playlistId(url);
  $("#music").innerHTML=!url
    ?`<header><div><h2>Party playlist</h2><p>Link a Spotify playlist so everyone can add songs.</p></div><button class="btn ghost" data-act="party">Add playlist link</button></header>`
    :`<header><h2>Party playlist</h2><span><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Open in Spotify</a> <button class="btn ghost" data-act="party">Change</button></span></header>`+
     (id?`<iframe src="https://open.spotify.com/embed/${id}?utm_source=generator" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" title="Spotify playlist"></iframe>`:"");
}

function renderHosts(){
  const box=$("#hosts");$("#addForm").hidden=!S.hosts.length;
  const sel=$("#aHost"),keep=sel.value;sel.innerHTML=hostOpts();if(S.hosts.some(h=>h.id===keep))sel.value=keep;
  if(!S.hosts.length){box.innerHTML=`<div class="big-empty"><h2>Who lives here?</h2><p>Add each housemate first, then everyone can add the guests they're inviting.</p><button class="btn" data-act="addHost">+ Add a housemate</button></div>`;return}
  box.innerHTML=`<div class="grid">${S.hosts.map(h=>{
    const gs=S.guests.filter(g=>g.host===h.id&&match(g.name,h.name));
    const all=S.guests.filter(g=>g.host===h.id),yes=all.filter(g=>g.status==="coming").length;
    const mine=S.items.filter(i=>i.who===h.id);
    return `<article class="host" style="--c:${hostColor(h.id)}">
      <header><h3>${esc(h.name)}</h3><button class="icon" data-act="editHost" data-id="${esc(h.id)}" aria-label="Edit ${esc(h.name)}">✎</button></header>
      <div class="sub">${all.length} invited · ${yes} coming</div>
      <div class="own">${mine.length?"Bringing "+mine.map(i=>`<span class="chip">${esc(i.name)}</span>`).join(""):"<em>Not bringing anything yet — pick something under What we need.</em>"}</div>
      <ul>${gs.length?gs.map(g=>`<li class="g ${g.status==="no"?"no":""}">
        <button class="st ${esc(g.status||"invited")}" data-act="cycle" data-id="${esc(g.id)}" title="Tap to change RSVP">${ST[g.status]||"Invited"}</button>
        <b>${esc(g.name)}</b>
        <button class="icon" data-act="editGuest" data-id="${esc(g.id)}" aria-label="Edit ${esc(g.name)}">✎</button></li>`).join("")
        :`<li class="empty">${all.length?"No matches.":"No guests yet — add one above."}</li>`}</ul></article>`}).join("")}</div>`;
}

function renderItems(){
  const w=$("#iWho"),keep=w.value;w.innerHTML=hostOpts("Nobody yet");w.value=S.hosts.some(h=>h.id===keep)?keep:"";
  const its=S.items.filter(i=>match(i.name,(S.hosts.find(h=>h.id===i.who)||{}).name));
  const done=S.items.filter(i=>i.who&&S.hosts.some(h=>h.id===i.who)).length,n=S.items.length;
  const have=new Set(S.items.map(i=>i.name.toLowerCase()));
  const sugg=SUGG.filter(s=>!have.has(s.toLowerCase()));
  $("#items").innerHTML=(n?`<div class="progress"><span>${done} of ${n} sorted</span><div class="meter"><i style="width:${n?done/n*100:0}%"></i></div></div>
    <ul class="list">${its.length?its.map(i=>{const own=S.hosts.some(h=>h.id===i.who);return `<li class="it ${own?"":"open"}">
      <b>${esc(i.name)}</b>
      <select data-act="who" data-id="${esc(i.id)}" aria-label="Who's bringing ${esc(i.name)}" style="--c:${hostColor(i.who)}">${hostOpts("Nobody yet").replace(`value="${esc(own?i.who:"")}"`,`value="${esc(own?i.who:"")}" selected`)}</select>
      <button class="icon" data-act="delItem" data-id="${esc(i.id)}" aria-label="Remove ${esc(i.name)}">×</button></li>`}).join(""):`<li class="empty">No matches.</li>`}</ul>`
    :`<div class="big-empty"><h2>What do we need?</h2><p>Add the things the party needs, then each housemate picks what they're bringing.</p></div>`)+
    (sugg.length?`<div class="sugg">Quick add: ${sugg.map(s=>`<button data-act="sugg" data-name="${esc(s)}">+ ${esc(s)}</button>`).join("")}</div>`:"");
}

function render(){renderParty();renderMusic();renderHosts();renderItems()}

// tabs & search
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;
  document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",x===b));
  $("#vHosts").hidden=S.tab!=="hosts";$("#vItems").hidden=S.tab!=="items"});
$("#q").oninput=e=>{S.q=e.target.value;renderHosts();renderItems()};

// add guest / item
$("#addForm").onsubmit=e=>{e.preventDefault();const name=$("#aName").value.trim();if(!name||!$("#aHost").value)return;
  put("guests",uid(),{host:$("#aHost").value,name,status:$("#aSt").value,created:Date.now()});
  $("#aName").value="";$("#aSt").value="invited";$("#aName").focus();toast(`${name} added`)};
function addItem(name,who){put("items",uid(),{name,who:who||"",created:Date.now()})}
$("#itemForm").onsubmit=e=>{e.preventDefault();const name=$("#iName").value.trim();if(!name)return;
  addItem(name,$("#iWho").value);$("#iName").value="";$("#iName").focus()};

// dialogs
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest("dialog").close());
function openHost(h){editing=h||null;$("#dhT").textContent=h?"Edit housemate":"Add a housemate";$("#hDel").hidden=!h;
  $("#hName").value=h?.name||"";$("#dHost").showModal();$("#hName").focus()}
$("#addHostBtn").onclick=()=>openHost();
$("#fHost").onsubmit=e=>{e.preventDefault();const name=$("#hName").value.trim();if(!name)return;
  put("hosts",editing?.id||uid(),{name,created:editing?.created||Date.now()});$("#dHost").close()};
$("#hDel").onclick=()=>{const h=editing,n=S.guests.filter(g=>g.host===h.id),its=S.items.filter(i=>i.who===h.id);$("#dHost").close();
  ask(`Remove ${h.name}?`,(n.length?`This also removes the ${n.length} guest${n.length>1?"s":""} they invited.`:"They have no guests on the list.")+(its.length?" Anything they were bringing goes back to “Nobody yet”.":""),
    async()=>{for(const g of n)await del("guests",g.id);for(const i of its)await put("items",i.id,{...strip(i),who:""});await del("hosts",h.id)})};

function openGuest(g){editing=g;$("#gHost").innerHTML=hostOpts();
  $("#gName").value=g.name;$("#gHost").value=g.host;$("#gSt").value=g.status||"invited";$("#dGuest").showModal()}
$("#fGuest").onsubmit=e=>{e.preventDefault();const name=$("#gName").value.trim();if(!name)return;
  put("guests",editing.id,{...strip(editing),name,host:$("#gHost").value,status:$("#gSt").value});$("#dGuest").close()};
$("#gDel").onclick=()=>{const g=editing;$("#dGuest").close();ask(`Remove ${g.name}?`,"They'll come off the guest list.",()=>del("guests",g.id))};

function ask(t,p,fn){$("#cT").textContent=t;$("#cP").textContent=p;confirmFn=fn;$("#dConfirm").showModal()}
$("#cOk").onclick=()=>{$("#dConfirm").close();confirmFn&&confirmFn()};

function openParty(){const p=S.party;$("#pT").value=p.title||"";$("#pD").value=p.date||"";$("#pH").value=p.time||"";$("#pW").value=p.where||"";$("#pS").value=p.playlist||"";$("#dParty").showModal()}
$("#editParty").onclick=openParty;
$("#fParty").onsubmit=e=>{e.preventDefault();const d={title:$("#pT").value.trim(),date:$("#pD").value,time:$("#pH").value,where:$("#pW").value.trim(),playlist:$("#pS").value.trim()};
  $("#dParty").close();S.party=d;sync({action:"party",data:d})};

document.body.addEventListener("click",e=>{const b=e.target.closest("button[data-act]");if(!b)return;const id=b.dataset.id,a=b.dataset.act;
  if(a==="addHost")openHost();
  if(a==="party")openParty();
  if(a==="editHost")openHost(S.hosts.find(h=>h.id===id));
  if(a==="editGuest")openGuest(S.guests.find(g=>g.id===id));
  if(a==="sugg")addItem(b.dataset.name,"");
  if(a==="delItem"){const i=S.items.find(x=>x.id===id);ask(`Remove ${i.name}?`,"It'll come off the list of things we need.",()=>del("items",id))}
  if(a==="cycle"){const g=S.guests.find(x=>x.id===id);g.status=ORDER[(ORDER.indexOf(g.status||"invited")+1)%4];
    sync({action:"put",col:"guests",id,data:strip(g)})}});
document.body.addEventListener("change",e=>{const s=e.target.closest("select[data-act=who]");if(!s)return;
  const i=S.items.find(x=>x.id===s.dataset.id);if(i)put("items",i.id,{...strip(i),who:s.value})});

render();

// load from the Google Sheet, then check for housemates' changes every 20 s
async function pull(){
  const a=document.activeElement;
  if(pending||document.hidden||document.querySelector("dialog[open]")||(a&&a.matches("main select")))return;
  try{const r=await fetch(SHEET_URL);const d=await r.json();if(d.error)throw new Error(d.error);if(!pending)applyRemote(d);note("")}
  catch(e){note("Couldn't reach the Google Sheet — what you see may be out of date.")}
}
if(SHEET_URL){if(!S.hosts.length)note("Loading the guest list…");pull();setInterval(pull,20000);document.addEventListener("visibilitychange",pull)}
else note("Not connected to a Google Sheet yet, so this list is saved in this browser only.");
}
</script>
</body>
</html>
